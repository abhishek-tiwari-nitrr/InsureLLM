[project]
name = "insurellm"
version = "0.1.0"
description = "A 100M-parameter insurance language model trained from scratch in PyTorch, with RAG"
readme = "README.md"
authors = [
    { name = "abhishek-tiwari-nitrr", email = "abhishek.tiwari.nitrr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
insurellm = "insurellm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

